name: Windows x64

on:
  push:
    paths:
      - "Windows/Pythia.WinUI/**"
      - "Windows/Pythia.WinUI.Tests/**"
      - "Windows/Pythia.Windows/assets/pythia-plugin-runner.cjs"
      - "Windows/Pythia.Windows/tool/prepare_plugin_runtime.ps1"
      - ".github/workflows/windows-x64.yml"
  pull_request:
    paths:
      - "Windows/Pythia.WinUI/**"
      - "Windows/Pythia.WinUI.Tests/**"
      - ".github/workflows/windows-x64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: Windows/Pythia.WinUI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Validate Pythia plugin contract and examples
        run: node ..\..\script\validate_pythia_plugins.mjs
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build native WinUI x64 release
        run: dotnet build .\Pythia.WinUI.csproj -c Release -p:Platform=x64
      - name: Run native smoke tests
        run: dotnet run --project ..\Pythia.WinUI.Tests\Pythia.WinUI.Tests.csproj -c Release
      - name: Build x64 installer and SHA-256
        shell: pwsh
        run: .\tool\build-installer.ps1 -Version 1.2.1
      - name: Verify installer checksum
        shell: pwsh
        run: |
          $installer = "dist\Pythia-1.2.1-windows-x64.exe"
          $sidecar = "$installer.sha256"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path $sidecar)) { throw "Missing checksum: $sidecar" }
          $expected = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "Installer checksum mismatch: expected $expected, got $actual"
          }
      - name: Verify native package contents
        shell: pwsh
        run: |
          if (-not (Test-Path publish\win-x64\Pythia.exe)) { throw "Missing Pythia.exe" }
          if (-not (Test-Path publish\win-x64\Runtime\node.exe)) { throw "Missing pinned plugin runtime" }
          if (Get-ChildItem publish\win-x64 -Recurse -File | Where-Object { $_.Extension -in '.pythia', '.potext' -or $_.FullName -match '[\\/]Plugins?[\\/]' }) {
            throw "Publish tree must not contain bundled third-party plugins"
          }
          if (Get-ChildItem publish\win-x64 -Recurse -Include *.pdb,*.pfx,*.pem,*.key) {
            throw "Publish tree contains debug symbols or secret-like files"
          }
      - name: Upload verified candidate
        uses: actions/upload-artifact@v7
        with:
          name: Pythia-1.2.1-windows-x64
          path: |
            Windows/Pythia.WinUI/dist/Pythia-1.2.1-windows-x64.exe
            Windows/Pythia.WinUI/dist/Pythia-1.2.1-windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
