<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" font-family="-apple-system,'Helvetica Neue','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf4"/>
      <stop offset="1" stop-color="#eaf2e2"/>
    </linearGradient>
    <filter id="msoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3d5a26" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="438" height="238" rx="18" fill="url(#mbg)" stroke="#dde7d2"/>

  <!-- menu bar -->
  <rect x="24" y="26" width="392" height="26" rx="8" fill="#ffffff" stroke="#e3eadb"/>
  <circle cx="44" cy="39" r="5" fill="#80B847"/>
  <text x="56" y="43" font-size="11" fill="#55653f">Pythia</text>
  <text x="396" y="43" font-size="10.5" fill="#8a967d" text-anchor="end">⇧⌘E</text>

  <!-- popover translator -->
  <g filter="url(#msoft)">
    <rect x="96" y="66" width="248" height="140" rx="14" fill="#ffffff" stroke="#e3eadb"/>
  </g>
  <rect x="112" y="82" width="90" height="20" rx="10" fill="#eef4e6"/>
  <text x="157" y="96" font-size="10" fill="#55653f" text-anchor="middle">自动检测</text>
  <rect x="238" y="82" width="90" height="20" rx="10" fill="#80B847"/>
  <text x="283" y="96" font-size="10" fill="#ffffff" text-anchor="middle">简体中文</text>
  <rect x="112" y="112" width="216" height="34" rx="8" fill="#f8faf6" stroke="#e3eadb"/>
  <text x="122" y="133" font-size="11" fill="#2c3524">Hello, native macOS.</text>
  <circle cx="124" cy="164" r="3.5" fill="#80B847"/>
  <text x="134" y="168" font-size="10" fill="#8a967d">Google</text>
  <text x="122" y="188" font-size="11.5" fill="#2c3524">你好，原生 macOS。</text>

  <text x="220" y="228" font-size="11" fill="#8a967d" text-anchor="middle">Swift 6 · AppKit · macOS 26+</text>
</svg>
